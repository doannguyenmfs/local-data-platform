version: 2

snapshots:
  - name: snap_customers
    description: >
      Historical customer record captured from stg_customers
      Grain: one row per customer version
    relation: ref('stg_customers')
    config:
      schema: snapshots
      unique_key: customer_id
      strategy: check
      check_cols:
        - first_name
        - last_name
        - email
      updated_at: updated_at
    columns:
      - name: dbt_scd_id
        description: Unique identifier generated by dbt for each customer version
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Stable bussines ID shared by all versions of a customer
        data_tests:
          - not_null
      - name: updated_at
        description: Source column used as effective changed time
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: Timestamp when this version became effective
        data_tests:
          - not_null
