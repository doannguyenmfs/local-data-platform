version: 2

snapshots:
  - name: snap_customers
    description: >
      Type-2 customer history captured from stg_customers. Changes to first
      name, last name or email create a new version.
      Grain: one row per customer version.
    relation: ref('stg_customers')
    config:
      # customer_id identifies the entity; dbt_scd_id identifies each version.
      schema: snapshots
      unique_key: customer_id
      # Check strategy creates history only when tracked business attributes
      # change. loaded_at is intentionally excluded so every Airflow retry does
      # not manufacture a new customer version.
      strategy: check
      check_cols:
        - first_name
        - last_name
        - email
      updated_at: updated_at
    columns:
      - name: dbt_scd_id
        description: >
          Opaque identifier generated by dbt for each snapshot version and
          exposed downstream as dim_customer.customer_sk.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Stable business identifier shared by all customer versions.
        data_tests:
          - not_null

      - name: first_name
        description: Customer first name for this historical version.

      - name: last_name
        description: Customer last name for this historical version.

      - name: email
        description: Customer email address for this historical version.

      - name: created_at
        description: Timestamp when the source customer was created.

      - name: updated_at
        description: Source timestamp supplied as the effective change time.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when Airflow last loaded the row into staging.

      - name: dbt_updated_at
        description: >
          Internal snapshot timestamp used by dbt for the version. With the
          current configuration it is derived from source updated_at.

      - name: dbt_valid_from
        description: Inclusive timestamp when this version became effective.
        data_tests:
          - not_null

      - name: dbt_valid_to
        description: >
          Exclusive timestamp when this version stopped being effective;
          null for the currently active version.
