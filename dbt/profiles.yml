# One logical profile exposes three explicit deployment targets. All secrets and
# host-dependent addresses come from environment variables; models stay target
# agnostic and `ref()` resolves relations into the selected schema.
local_data_platform:
  target: dev
  outputs:
    dev:
      # Local iteration schema. Four threads match the laptop-sized database.
      type: postgres
      host: "{{ env_var('ECOMMERCE_POSTGRES_HOST') }}"
      port: "{{ env_var('ECOMMERCE_POSTGRES_HOST_PORT') | int }}"
      user: "{{ env_var('ECOMMERCE_POSTGRES_USER') }}"
      password: "{{ env_var('ECOMMERCE_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('ECOMMERCE_POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_DEV_SCHEMA', 'dbt_dev') }}"
      threads: 4
      connect_timeout: 10
    ci:
      # Disposable schema populated by deterministic GitHub Actions fixtures.
      type: postgres
      host: "{{ env_var('ECOMMERCE_POSTGRES_HOST') }}"
      port: "{{ env_var('ECOMMERCE_POSTGRES_HOST_PORT') | int }}"
      user: "{{ env_var('ECOMMERCE_POSTGRES_USER') }}"
      password: "{{ env_var('ECOMMERCE_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('ECOMMERCE_POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'dbt_ci') }}"
      threads: 4
      connect_timeout: 10
    prod:
      # Production-shaped name/threads only; the local Compose topology is not
      # made production-ready merely by selecting this target.
      type: postgres
      host: "{{ env_var('ECOMMERCE_POSTGRES_HOST') }}"
      port: "{{ env_var('ECOMMERCE_POSTGRES_HOST_PORT') | int }}"
      user: "{{ env_var('ECOMMERCE_POSTGRES_USER') }}"
      password: "{{ env_var('ECOMMERCE_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('ECOMMERCE_POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA', 'analytics') }}"
      threads: 8
      connect_timeout: 10
