
version: 2

models:
  - name: dim_product
    description: >
      Dimension of current state of product used by analytic mart
      Grain: one row per product
    columns:
      - name: product_id
        description: ...
        data_tests:
          - unique
          - not_null
      - name: name
        description: ...
        data_tests:
          - not_null
      - name: category
        description: ...\
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Electronics
                  - Clothing
                  - Home
                  - Beauty
                  - Sports
                  - Books
                  - Toys
                  - Food
              config:
                severity: warn
      - name: price
        description: ...
        data_tests:
          - not_null  