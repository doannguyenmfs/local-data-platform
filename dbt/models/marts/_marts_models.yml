
version: 2

models:
  - name: dim_product
    description: >
      Dimension of current state of product used by analytic mart
      Grain: one row per product
    columns:
      - name: product_id
        description: ...
        data_tests:
          - unique
          - not_null
      - name: name
        description: ...
        data_tests:
          - not_null
      - name: category
        description: ...
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Electronics
                  - Clothing
                  - Home
                  - Beauty
                  - Sports
                  - Books
                  - Toys
                  - Food
              config:
                severity: warn
      - name: price
        description: ...
        data_tests:
          - not_null
  - name: dim_customer
    description: >
      Type-2 slowly changed customer Dimension
      Grain: one row per customer version
    columns:
      - name: customer_sk
        description: Unique surrogate key of a customer version
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer ID shared across by customer version
        data_tests:
          - not_null
      - name: valid_from
        description: Timestamp that the version becom effective
        data_tests:
          - not_null
      - name: is_current
        description: Indicate whether this version is the current version
        data_tests:
          - not_null

