services:
  postgres:
    image: postgres:16
    container_name: local-data-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataeng
      POSTGRES_PASSWORD: dataeng
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataeng -d ecommerce"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/opt/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # container memory limit
    # should remove limit when the data become very large
    mem_limit: 2g

volumes:
  postgres-data: