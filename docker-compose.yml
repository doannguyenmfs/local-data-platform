# P0 local physical topology: 35 service definitions = 21 long-running
# processes + 4 init jobs + 10 one-shot tools, backed by 9 named volumes. These
# counts document executable roles, not HA nodes: every durable subsystem still
# has a single local failure domain.
#
# The default profile starts core PostgreSQL/Airflow; optional profiles add
# Spark, lakehouse, streaming and monitoring. `tools` services are finite jobs
# created by `docker compose run`, not daemons. P1 capabilities such as off-host
# backup, TLS/RBAC, HA, lineage and centralized telemetry are intentionally not
# hidden in this file; their design and Done criteria live in docs/backlog.md.

# One anchor keeps all five Airflow daemons on the same image, connection
# contract and bind mounts. Per-service sections below change only their role.
x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: local-data-platform-airflow:3.3.0-dbt1.12
    user: "${AIRFLOW_UID}:0"
    environment:
      # --------------------------------------------------------
      # Core
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_TIMEZONE}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: ${AIRFLOW_DAG_PROCESSOR_REFRESH_INTERVAL}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
      # --------------------------------------------------------
      # Airflow metadata database
      # --------------------------------------------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:${AIRFLOW_POSTGRES_PORT}/${AIRFLOW_POSTGRES_DB}
      # --------------------------------------------------------
      # Celery
      # --------------------------------------------------------
      AIRFLOW__CELERY__BROKER_URL: redis://redis:${REDIS_PORT}/0
      AIRFLOW__CELERY__RESULT_BACKEND: >-
        db+postgresql://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:${AIRFLOW_POSTGRES_PORT}/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_CELERY_WORKER_CONCURRENCY}
      # --------------------------------------------------------
      # API
      # --------------------------------------------------------
      AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}

      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_DEV_SCHEMA: ${DBT_DEV_SCHEMA:-dbt_dev}
      DBT_CI_SCHEMA: ${DBT_CI_SCHEMA:-dbt_ci}
      DBT_PROD_SCHEMA: ${DBT_PROD_SCHEMA:-analytics}

      SPARK_GATEWAY_URL: http://spark-gateway:8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_ORDER_TOPIC: ecommerce.order-events.v1

      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      # dbt profiles also supports running from the host, where the published
      # port may differ from PostgreSQL's container port.
      ECOMMERCE_POSTGRES_HOST_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
    volumes:
      # Airflow files
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./postgres:/opt/postgres-sql-statement
      # dbt project source
      # Only source-controlled dbt files are mounted.
      # Host .venv, target and logs are intentionally excluded.
      - ./dbt/dbt_project.yml:/opt/airflow/dbt/dbt_project.yml:ro
      - ./dbt/profiles.yml:/opt/airflow/dbt/profiles.yml:ro
      - ./dbt/models:/opt/airflow/dbt/models:ro
      - ./dbt/snapshots:/opt/airflow/dbt/snapshots:ro
      - ./dbt/tests:/opt/airflow/dbt/tests:ro
      - ./dbt/docs:/opt/airflow/dbt/docs:ro
      - ./kafka/producer:/opt/airflow/kafka-producer:ro
    depends_on:
      postgres:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# Master, worker, gateway and job drivers share one Spark image and one catalog/
# object-store contract. This avoids driver/executor jar and config drift.
x-spark-common: &spark-common
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: local-data-platform-spark:3.5.9
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      SPARK_SALES_OUTPUT: /opt/lakehouse/parquet/sales
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dataeng}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dataeng_minio_password}
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_ORDER_TOPIC: ecommerce.order-events.v1
      SPARK_STREAM_CHECKPOINT: /opt/lakehouse/checkpoints/order-events-v1
      SPARK_NO_DAEMONIZE: "1"
    volumes:
      - lakehouse-data:/opt/lakehouse

services:
  # =============
  # SOURCE DATA BASE
  # =============
  postgres:
    image: postgres:16
    container_name: local-data-platform-postgres
    restart: unless-stopped
    # Debezium reads committed row changes from PostgreSQL WAL through the
    # built-in pgoutput logical-decoding plug-in. max_slot_wal_keep_size is a
    # local safety valve: a dead connector cannot retain WAL without limit.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1024MB
    environment:
      POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECOMMERCE_POSTGRES_USER} -d ${ECOMMERCE_POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "${ECOMMERCE_POSTGRES_HOST_PORT}:${ECOMMERCE_POSTGRES_PORT}"
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # container memory limit
    # should remove limit when the data become very large
    mem_limit: 2g

  # =============
  # AIRFLOW METADATA DATABASE
  # =============
  airflow-postgres:
    image: postgres:16
    container_name: local-data-platform-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  # =============
  # REDIS
  # =============
  redis:
    image: redis:7-alpine
    container_name: local-data-platform-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - redis-data:/data
  # ==========================================================
  # AIRFLOW INIT
  # ==========================================================
  airflow-init:
    <<: *airflow-common
    container_name: local-data-platform-airflow-init
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -e
        airflow db migrate
        echo "airflow db migration completed!"
    restart: "no"
  # ==========================================================
  # AIRFLOW API SERVER
  # ==========================================================
  airflow-api-server:
    <<: *airflow-common
    container_name: local-data-platform-airflow-api-server
    command:
      - api-server
    ports:
      - "${AIRFLOW_HOST_PORT}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: local-data-platform-airflow-scheduler
    command:
      - scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  # ==========================================================
  # AIRFLOW DAG PROCESSOR
  # ==========================================================
  airflow-dag-processor:
    <<: *airflow-common
    container_name: local-data-platform-airflow-dag-processor
    command:
      - dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  # ==========================================================
  # AIRFLOW CELERY WORKER
  # ==========================================================
  airflow-worker:
    <<: *airflow-common
    container_name: local-data-platform-airflow-worker
    command:
      - celery
      - worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  # ==========================================================
  # AIRFLOW TRIGGERER
  # ==========================================================
  airflow-triggerer:
    <<: *airflow-common
    container_name: local-data-platform-airflow-triggerer
    command:
      - triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================================
  # SPARK STANDALONE CLUSTER
  # ==========================================================
  spark-master:
    <<: *spark-common
    container_name: local-data-platform-spark-master
    profiles: ["spark"]
    entrypoint: ["/opt/spark/sbin/start-master.sh"]
    command:
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_NO_DAEMONIZE: "1"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - lakehouse-data:/opt/lakehouse

  spark-worker:
    <<: *spark-common
    container_name: local-data-platform-spark-worker
    profiles: ["spark"]
    entrypoint: ["/opt/spark/sbin/start-worker.sh"]
    command:
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 3g
      - --webui-port
      - "8080"
    ports:
      - "8082:8080"
    volumes:
      - lakehouse-data:/opt/lakehouse
    depends_on:
      - spark-master

  spark-gateway:
    <<: *spark-common
    container_name: local-data-platform-spark-gateway
    hostname: spark-gateway
    profiles: ["spark"]
    entrypoint: ["python3", "/opt/spark/gateway/job_gateway.py"]
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  spark-submit:
    <<: *spark-common
    profiles: ["tools"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - /opt/spark/jobs/sales_batch.py
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started

  iceberg-submit:
    <<: *spark-common
    profiles: ["tools"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - /opt/spark/jobs/iceberg_sales.py
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  iceberg-maintenance:
    <<: *spark-common
    profiles: ["tools"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - /opt/spark/jobs/maintain_iceberg.py
    depends_on:
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # ==========================================================
  # LAKEHOUSE OBJECT STORAGE
  # ==========================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: local-data-platform-minio
    profiles: ["lakehouse"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dataeng}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dataeng_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["lakehouse"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dataeng}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dataeng_minio_password}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/warehouse
    depends_on:
      minio:
        condition: service_healthy

  # ==========================================================
  # KAFKA EVENT STREAMING
  # ==========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: local-data-platform-kafka
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      # One combined KRaft broker/controller is resource-efficient for local
      # learning. RF=1 below is not an HA production topology.
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["streaming"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ecommerce.order-events.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000
        # Apicurio KafkaSQL rebuilds registry state from this journal. Unlike a
        # business event topic, it must never expire records by time or size.
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ecommerce.registry.journal.v3 \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=-1 \
          --config retention.bytes=-1
    depends_on:
      kafka:
        condition: service_healthy

  # Registry stores versioned event contracts and rejects incompatible schema
  # evolution. KafkaSQL makes the Kafka journal the durable source of truth;
  # the embedded SQL state is only a cache rebuilt after restart.
  schema-registry:
    image: apicurio/apicurio-registry:3.2.5
    container_name: local-data-platform-schema-registry
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:19092
      APICURIO_KAFKASQL_TOPIC: ecommerce.registry.journal.v3
      # Enforce valid Avro and compatibility against every prior version. A
      # lagging consumer can therefore still read data from older schemas.
      APICURIO_RULES_GLOBAL_VALIDITY: FULL
      APICURIO_RULES_GLOBAL_COMPATIBILITY: BACKWARD_TRANSITIVE
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:-8084}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        # Apicurio exposes application APIs on 8080 and Quarkus management
        # health on its internal port 9000.
        - curl --fail --silent http://localhost:9000/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 1g

  # Kafka Connect hosts the Debezium PostgreSQL source connector. Connector
  # offsets/config/status live in compacted Kafka internal topics, while the
  # PostgreSQL replication slot retains the unread WAL position.
  debezium-connect:
    image: quay.io/debezium/connect:3.6.2.Final
    container_name: local-data-platform-debezium-connect
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: ecommerce-cdc-connect
      CONFIG_STORAGE_TOPIC: ecommerce.connect.configs
      OFFSET_STORAGE_TOPIC: ecommerce.connect.offsets
      STATUS_STORAGE_TOPIC: ecommerce.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Install Apicurio's converter plug-ins. The Debezium connector overrides
      # the worker JSON defaults with registry-backed Avro; keeping defaults
      # avoids silently changing unrelated future connectors.
      ENABLE_APICURIO_CONVERTERS: "true"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "8083:8083"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8083/connector-plugins >/dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    mem_limit: 1g

  # This finite deployment step creates the least-privilege PostgreSQL role and
  # publication, then PUTs the connector configuration through Connect REST.
  # It is safe to run again after config changes or container recreation.
  cdc-bootstrap:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["streaming"]
    entrypoint: ["python", "/app/cdc/bootstrap.py"]
    volumes:
      # The image also COPYs this directory for CI/immutable deployment. This
      # read-only mount shortens the local edit/test loop without rebuilding.
      - ./cdc:/app/cdc:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      CDC_POSTGRES_USER: ${CDC_POSTGRES_USER:-cdc_reader}
      CDC_POSTGRES_PASSWORD: ${CDC_POSTGRES_PASSWORD:-cdc_local_password}
      CDC_CONNECTOR_NAME: ${CDC_CONNECTOR_NAME:-ecommerce-postgres-cdc-avro}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc_avro}
      CDC_SLOT_NAME: ${CDC_SLOT_NAME:-ecommerce_cdc_avro_slot}
      CDC_PUBLICATION_NAME: ${CDC_PUBLICATION_NAME:-ecommerce_cdc_publication}
      DEBEZIUM_CONNECT_URL: http://debezium-connect:8083
      SCHEMA_REGISTRY_NATIVE_URL: http://schema-registry:8080/apis/registry/v2
    depends_on:
      debezium-connect:
        condition: service_healthy

  # Manual destructive-safe verification: inserts, updates and then removes a
  # unique test customer, requiring Debezium c/u/d and tombstone records.
  cdc-smoke-test:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    entrypoint: ["python", "/app/cdc/verify_cdc.py"]
    volumes:
      - ./cdc:/app/cdc:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc_avro}
      SCHEMA_REGISTRY_CCOMPAT_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      cdc-bootstrap:
        condition: service_completed_successfully

  # Read-only compatibility proof: the real Debezium key/value subjects must
  # exist, current schemas must pass, and an intentionally breaking type change
  # must be rejected without registering a synthetic version.
  schema-contract-test:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    entrypoint: ["python", "/app/schema_registry/verify_contract.py"]
    volumes:
      - ./schema_registry:/app/schema_registry:ro
    environment:
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc_avro}
      SCHEMA_REGISTRY_CCOMPAT_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      cdc-bootstrap:
        condition: service_completed_successfully

  # Long-running data-plane consumer. It drains the initial Debezium snapshot,
  # follows live WAL changes, writes immutable Bronze evidence and applies
  # current customer state (including deletes) to Silver.
  customer-cdc-materializer:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    container_name: local-data-platform-customer-cdc-materializer
    profiles: ["streaming"]
    restart: unless-stopped
    entrypoint: ["python", "/app/cdc/materialize_customers.py"]
    volumes:
      - ./cdc:/app/cdc:ro
      - ./postgres/sql:/app/postgres/sql:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc_avro}
      CDC_CUSTOMER_CONSUMER_GROUP: ${CDC_CUSTOMER_CONSUMER_GROUP:-customer-cdc-silver-v1}
      SCHEMA_REGISTRY_CCOMPAT_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      cdc-bootstrap:
        condition: service_completed_successfully

  # Finite drain mode is useful for maintenance and deterministic tests. It
  # uses the same consumer group/state as the daemon and exits after backlog is
  # empty rather than creating a second writer contract.
  customer-cdc-once:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    entrypoint:
      - python
      - /app/cdc/materialize_customers.py
      - --idle-exit-seconds
      - "5"
    volumes:
      - ./cdc:/app/cdc:ro
      - ./postgres/sql:/app/postgres/sql:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-ecommerce_cdc_avro}
      CDC_CUSTOMER_CONSUMER_GROUP: ${CDC_CUSTOMER_CONSUMER_GROUP:-customer-cdc-silver-v1}
      SCHEMA_REGISTRY_CCOMPAT_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      cdc-bootstrap:
        condition: service_completed_successfully

  cdc-materialization-test:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    entrypoint: ["python", "/app/cdc/verify_materialization.py"]
    volumes:
      - ./cdc:/app/cdc:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
    depends_on:
      customer-cdc-materializer:
        condition: service_started

  cdc-reconcile:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    entrypoint: ["python", "/app/cdc/reconcile_customers.py"]
    volumes:
      - ./cdc:/app/cdc:ro
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
    depends_on:
      customer-cdc-materializer:
        condition: service_started

  order-producer:
    build:
      context: .
      dockerfile: kafka/producer/Dockerfile
    image: local-data-platform-order-producer:1.0.0
    profiles: ["tools"]
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_ORDER_TOPIC: ecommerce.order-events.v1
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-stream:
    <<: *spark-common
    container_name: local-data-platform-order-stream
    profiles: ["streaming"]
    restart: unless-stopped
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=1g
      # Keep the always-on query within half of the 2-core local worker so a
      # finite gateway job can still acquire executor resources.
      - /opt/spark/jobs/order_stream.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  order-stream-once:
    <<: *spark-common
    profiles: ["tools"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=1g
      - /opt/spark/jobs/order_stream.py
      - --available-now
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  # ==========================================================
  # OBSERVABILITY
  # ==========================================================
  platform-exporter:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    image: local-data-platform-exporter:1.0.0
    container_name: local-data-platform-exporter
    profiles: ["monitoring"]
    environment:
      ECOMMERCE_POSTGRES_HOST: postgres
      ECOMMERCE_POSTGRES_PORT: ${ECOMMERCE_POSTGRES_PORT}
      ECOMMERCE_POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      ECOMMERCE_POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      ECOMMERCE_POSTGRES_DB: ${ECOMMERCE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_ORDER_TOPIC: ecommerce.order-events.v1
      CDC_CONNECTOR_NAME: ${CDC_CONNECTOR_NAME:-ecommerce-postgres-cdc-avro}
      CDC_SLOT_NAME: ${CDC_SLOT_NAME:-ecommerce_cdc_avro_slot}
      DEBEZIUM_CONNECT_URL: http://debezium-connect:8083
      SCHEMA_REGISTRY_HEALTH_URL: http://schema-registry:9000/health/ready
      SPARK_GATEWAY_HEALTH_URL: http://spark-gateway:8090/health
      MINIO_HEALTH_URL: http://minio:9000/minio/health/live
      AIRFLOW_HEALTH_URL: http://airflow-api-server:8080/api/v2/monitor/health
      EXPORTER_PORT: 9100
      COLLECTION_INTERVAL_SECONDS: 15
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: local-data-platform-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - platform-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: local-data-platform-alertmanager
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.2.1
    container_name: local-data-platform-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dataeng_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
  # =============
  # AIRFLOW CONFUGURATION
  # =============
volumes:
  # Named volumes survive container recreation. They are local durability, not
  # off-host backup; `docker compose down -v` removes all of them.
  ecommerce-postgres-data:
  airflow-postgres-data:
  redis-data:
  lakehouse-data:
  minio-data:
  kafka-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
