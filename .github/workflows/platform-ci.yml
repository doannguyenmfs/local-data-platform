# Fast platform gates: syntax/config validation, pure Spark tests and image
# reproducibility. Full stateful end-to-end runs remain a separate local gate.
name: Platform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "airflow/**"
      - "spark/**"
      - "kafka/**"
      - "cdc/**"
      - "monitoring/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "airflow/**"
      - "spark/**"
      - "kafka/**"
      - "cdc/**"
      - "monitoring/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Python, Compose and monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create CI environment
        run: cp .env.example .env

      - name: Compile Python
        run: |
          python -m compileall -q \
            airflow/dags \
            spark/jobs \
            spark/tests \
            spark/gateway \
            kafka/producer \
            cdc \
            monitoring

      - name: Validate Compose
        run: |
          docker compose \
            --profile spark \
            --profile lakehouse \
            --profile streaming \
            --profile monitoring \
            --profile tools \
            config --quiet

      - name: Validate JSON dashboards
        run: python -m json.tool monitoring/grafana/dashboards/platform-overview.json >/dev/null

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            --entrypoint amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.0 \
            check-config /etc/alertmanager/alertmanager.yml

  spark-tests:
    name: Spark transformation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Spark runtime
        run: docker build --file spark/Dockerfile --tag local-data-platform-spark:ci .

      - name: Test batch transformation
        run: |
          docker run --rm \
            --entrypoint /opt/spark/bin/spark-submit \
            local-data-platform-spark:ci \
            --master 'local[2]' \
            /opt/spark/tests/test_sales_batch.py

      - name: Test streaming event parser
        run: |
          docker run --rm \
            --entrypoint /opt/spark/bin/spark-submit \
            local-data-platform-spark:ci \
            --master 'local[2]' \
            /opt/spark/tests/test_order_stream.py

  image-builds:
    name: Runtime images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Airflow runtime
        run: docker build --file airflow/Dockerfile --tag local-data-platform-airflow:ci .

      - name: Build Kafka producer
        run: docker build --file kafka/producer/Dockerfile --tag local-data-platform-producer:ci .

      - name: Build platform exporter
        run: docker build --file monitoring/Dockerfile --tag local-data-platform-exporter:ci .
