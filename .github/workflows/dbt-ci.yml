name: dbt CI

on:
  # Required check phải luôn được tạo cho mọi pull request vào main.
  pull_request:
    branches:
      - main

  # Sau khi merge, chỉ chạy lại khi thành phần data platform thay đổi.
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - "postgres/init/**"
      - "postgres/ci/**"
      - ".github/workflows/dbt-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-build:
    name: Parse, build and test dbt
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataeng
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataeng -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ECOMMERCE_POSTGRES_HOST: localhost
      ECOMMERCE_POSTGRES_HOST_PORT: "5432"
      ECOMMERCE_POSTGRES_USER: dataeng
      ECOMMERCE_POSTGRES_PASSWORD: ci_password
      ECOMMERCE_POSTGRES_DB: ecommerce

      DBT_CI_SCHEMA: dbt_ci_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement dbt/requirements.txt

      - name: Initialize PostgreSQL schemas
        env:
          PGPASSWORD: ${{ env.ECOMMERCE_POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "$ECOMMERCE_POSTGRES_HOST" \
            --port "$ECOMMERCE_POSTGRES_HOST_PORT" \
            --username "$ECOMMERCE_POSTGRES_USER" \
            --dbname "$ECOMMERCE_POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --file postgres/init/001_schema.sql

          psql \
            --host "$ECOMMERCE_POSTGRES_HOST" \
            --port "$ECOMMERCE_POSTGRES_HOST_PORT" \
            --username "$ECOMMERCE_POSTGRES_USER" \
            --dbname "$ECOMMERCE_POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --file postgres/init/002_staging_analytics_schema.sql

          psql \
            --host "$ECOMMERCE_POSTGRES_HOST" \
            --port "$ECOMMERCE_POSTGRES_HOST_PORT" \
            --username "$ECOMMERCE_POSTGRES_USER" \
            --dbname "$ECOMMERCE_POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --file postgres/ci/001_seed_staging.sql

      - name: Show dbt version
        run: dbt --version

      - name: Validate dbt connection
        run: |
          dbt debug \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ci

      - name: Parse dbt project
        run: |
          dbt parse \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ci \
            --no-partial-parse

      - name: Build and test dbt project
        run: |
          dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ci \
            --no-partial-parse

      - name: Rebuild to verify incremental idempotency
        run: |
          dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ci \
            --no-partial-parse

      - name: Mutate staging data
        env:
          PGPASSWORD: ${{ env.ECOMMERCE_POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "$ECOMMERCE_POSTGRES_HOST" \
            --port "$ECOMMERCE_POSTGRES_HOST_PORT" \
            --username "$ECOMMERCE_POSTGRES_USER" \
            --dbname "$ECOMMERCE_POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --file postgres/ci/002_mutate_staging.sql

      - name: Build changed records incrementally
        run: |
          dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ci \
            --no-partial-parse

      - name: Assert incremental results
        env:
          PGPASSWORD: ${{ env.ECOMMERCE_POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "$ECOMMERCE_POSTGRES_HOST" \
            --port "$ECOMMERCE_POSTGRES_HOST_PORT" \
            --username "$ECOMMERCE_POSTGRES_USER" \
            --dbname "$ECOMMERCE_POSTGRES_DB" \
            --set ON_ERROR_STOP=1 \
            --set dbt_schema="$DBT_CI_SCHEMA" \
            --file postgres/ci/003_assert_incremental_results.sql
