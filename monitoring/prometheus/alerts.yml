# Every rule has an actionable semantic condition and a `for` debounce window.
# Thresholds match the local daily SLA; production values must follow real SLOs.
groups:
  - name: local-data-platform
    rules:
      - alert: PlatformComponentDown
        expr: platform_component_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} is unavailable"
          description: "Semantic health checks have failed for more than two minutes."

      - alert: PipelineWatermarkStale
        # 172800 seconds = 48 hours: two missed daily delivery opportunities.
        expr: pipeline_watermark_lag_seconds > 172800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pipeline }} watermark is more than 48 hours old"

      - alert: PipelineCandidateStuck
        # Candidate means extract started but the cross-sink commit barrier did
        # not finish; it is more urgent than ordinary freshness lag.
        expr: pipeline_candidate_pending == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pipeline }} candidate watermark has not committed"

      - alert: RequiredKafkaTopicMissing
        expr: kafka_topic_partitions < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Required Kafka topic has no available partitions"

      - alert: DebeziumConnectorNotRunning
        expr: cdc_connector_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Debezium connector {{ $labels.connector }} is not running"
          description: "Connector or its PostgreSQL source task has left RUNNING state."

      - alert: CdcReplicationSlotInactive
        expr: cdc_replication_slot_active == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CDC replication slot {{ $labels.slot }} is inactive"
          description: "An inactive slot retains WAL but is not delivering changes."

      - alert: CdcReplicationSlotWalRetentionHigh
        # The local PostgreSQL safety cap is 1 GiB; warn at half that amount so
        # an operator can restore the connector before slot invalidation.
        expr: cdc_replication_slot_retained_bytes > 536870912
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CDC slot {{ $labels.slot }} retains more than 512 MiB WAL"

      - alert: StagingTableEmpty
        expr: staging_table_rows == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "staging.{{ $labels.table }} is empty"
