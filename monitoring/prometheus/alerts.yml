# Every rule has an actionable semantic condition and a `for` debounce window.
# Thresholds match the local daily SLA; production values must follow real SLOs.
groups:
  - name: local-data-platform
    rules:
      - alert: PlatformComponentDown
        expr: platform_component_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} is unavailable"
          description: "Semantic health checks have failed for more than two minutes."

      - alert: PipelineWatermarkStale
        # 172800 seconds = 48 hours: two missed daily delivery opportunities.
        expr: pipeline_watermark_lag_seconds > 172800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pipeline }} watermark is more than 48 hours old"

      - alert: PipelineCandidateStuck
        # Candidate means extract started but the cross-sink commit barrier did
        # not finish; it is more urgent than ordinary freshness lag.
        expr: pipeline_candidate_pending == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pipeline }} candidate watermark has not committed"

      - alert: RequiredKafkaTopicMissing
        expr: kafka_topic_partitions < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Required Kafka topic has no available partitions"

      - alert: StagingTableEmpty
        expr: staging_table_rows == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "staging.{{ $labels.table }} is empty"
