# Prometheus scrapes itself for engine health and the custom exporter for
# platform semantics. It does not scrape every dependency directly because the
# exporter translates heterogeneous checks into one bounded metric contract.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  # Alert evaluation remains in Prometheus; grouping/routing lives in the
  # separately stateful Alertmanager service.
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: local-data-platform
    static_configs:
      - targets: ["platform-exporter:9100"]
